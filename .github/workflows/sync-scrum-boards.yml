name: อัปเดตกระดาน AMLO Scrum

on:
  push:
    paths:
      - 'scripts/sync_boards.py'
      - '.github/workflows/sync-scrum-boards.yml'
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: amlo-scrum-board-sync
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: โหลด Repository
        uses: actions/checkout@v4
      - name: สร้าง Labels และซิงก์กระดานจาก Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/sync_boards.py
      - name: บันทึกกระดานเมื่อมีการเปลี่ยนแปลง
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-management/SCRUM_BOARD.md project-management/PROGRAM_BOARD.md project-management/DELIVERY_BOARD.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh Scrum, Program, and Delivery boards"
            git push
          fi
